<svg width="140" height="40" viewBox="0 0 140 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background with gradient -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield shape -->
  <path d="M8 12C8 8 11 6 16 6C21 6 24 8 24 12V20C24 26 20 30 16 34C12 30 8 26 8 20V12Z" 
        fill="url(#shieldGradient)" 
        stroke="#1e40af" 
        stroke-width="0.5"/>
  
  <!-- Checkmark -->
  <path d="M12 18L15 21L20 16" 
        stroke="url(#checkGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Company name -->
  <text x="34" y="16" font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" font-weight="700" fill="#1e293b">
    TrustEscrow
  </text>
  
  <!-- Tagline -->
  <text x="34" y="28" font-family="system-ui, -apple-system, sans-serif" 
        font-size="10" font-weight="500" fill="#64748b" letter-spacing="0.5px">
    SECURE TRANSACTIONS
  </text>
</svg>